<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>통합 보고서 — 비공개 저장소로 옮겼습니다</title>
<!-- 옛 주소로 들어오는 사람을 위한 안내 한 장.
     원본 보고서·그림은 2026-10-01 디렉터 결정으로 비공개 저장소로 옮겼다(원본 그대로 보존). -->
<style>
  :root { --bg:#fbf8f4; --fg:#1d1b19; --mute:#6b645d; --line:#e6ddd2; --accent:#e8590c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171513; --fg:#ece6df; --mute:#a39a90; --line:#3a342e; --accent:#ff8a4c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:400 16px/1.75 system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  main { max-width:620px; margin:12vh auto; padding:0 16px; }
  .tag { font-size:13px; color:var(--mute); letter-spacing:.02em; margin:0 0 10px; }
  h1 { font-size:24px; line-height:1.4; margin:0 0 18px; }
  .box { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px;
         padding:14px 18px; margin:0 0 22px; }
  .box p { margin:0; }
  .box p + p { margin-top:8px; }
  a { color:var(--accent); font-weight:600; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .mute { color:var(--mute); font-size:14px; }
</style>
</head>
<body>
<main>
  <p class="tag">순순팩토리 1차 해커톤 · 《순순히 따라와라》</p>
  <h1>통합 보고서는 비공개 저장소로 옮겼습니다</h1>
  <div class="box">
    <p>이 주소에 있던 <b>«밖에서 본 SPUM — 외부 개발자 4인 클로즈드 테스트 기록»</b>은
       2026-10-01 에 비공개 저장소로 옮겼습니다. 원본은 그대로 보존하고 있습니다.</p>
    <p>열람이 필요하시면 <b>김주영</b>에게 말씀해 주세요.</p>
  </div>
  <p><a href="../">프로젝트 폴더로 &#8594;</a></p>
  <p class="mute">옛 링크로 들어오신 분이 빈 화면을 보지 않도록 이 안내만 남겨 둡니다.</p>
</main>
</body>
</html>
