<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드뉴스 에이전트</title>
<style>
/* ════════════════════════════════════════════════════════════
   ★재설계 2026-09-10 — 「문서」에서 「앱」으로

   무엇이 문제였나
     · 모든 구간이 세로로 쌓여 «지금 뭘 해야 하는지»가 안 보였다
     · 조사가 200초 걸리는데 「작업 중…」 다섯 글자가 전부였다
     · 결과물(카드)이 스크롤 맨 아래 묻혀 있었다

   무엇을 바꿨나 (기능은 «하나도» 빼지 않았다)
     ① 왼쪽에 «단계 레일» — 어디까지 왔고 다음이 뭔지 항상 보인다
     ② 「지금 할 일」 배너 — 사람 차례면 맨 위에 크게
     ③ 지난 단계는 «접어» 둔다 (progressive disclosure)
     ④ 기다리는 동안 skeleton + «경과 시간» + 무엇을 하는 중인지
     ⑤ 카드는 갤러리로 크게 · 눌러서 확대
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#f7f6f3; --surface:#fff; --surface-2:#faf9f6;
  --ink:#1b1a18; --dim:#6b6660; --faint:#948f88;
  --line:#e3dfd8; --line-strong:#cfc9c0;
  --accent:#8a5a20; --accent-ink:#fff; --accent-bg:#f4ece0;
  --ok:#2f6b45; --ok-bg:#e9f3ec; --warn:#9a5b12; --warn-bg:#fbf1e2;
  --bad:#9b3232; --bad-bg:#fbeaea; --code:#f1eee8;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  --r:10px; --r-lg:14px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --shadow:0 1px 2px rgba(27,26,24,.04),0 4px 14px rgba(27,26,24,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141317; --surface:#1d1c21; --surface-2:#232228;
  --ink:#eae7e1; --dim:#a49e96; --faint:#7d7871;
  --line:#33313a; --line-strong:#454250;
  --accent:#d8b47a; --accent-ink:#1d1c21; --accent-bg:#2c2620;
  --ok:#7fc39a; --ok-bg:#1d2b23; --warn:#e0ab63; --warn-bg:#2c2418;
  --bad:#e08585; --bad-bg:#2e1e1e; --code:#26252b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
:where(a,button,input,textarea,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── 머리 ─────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);padding:10px clamp(12px,3vw,24px);
  display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.top .mark{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.top .mark svg{width:20px;height:20px;color:var(--accent)}
.top .tag{color:var(--dim);font-size:13px}
.top .spacer{flex:1}
.top .live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)}.dot.busy{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── 뼈대 ─────────────────────────────────────── */
.shell{max-width:1240px;margin:0 auto;padding:var(--sp4) clamp(12px,3vw,24px) 96px;
  display:grid;gap:var(--sp5);grid-template-columns:1fr}
@media(min-width:1024px){.shell.has-rail{grid-template-columns:248px minmax(0,1fr)}}
.rail{align-self:start}
@media(min-width:1024px){.rail{position:sticky;top:76px}}
.col{min-width:0;display:flex;flex-direction:column;gap:var(--sp4)}

/* ── 카드 ─────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel>.hd{display:flex;align-items:baseline;gap:var(--sp2);flex-wrap:wrap;
  padding:14px var(--sp4) 0}
.panel>.bd{padding:var(--sp3) var(--sp4) var(--sp4)}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:var(--sp4) 0 var(--sp2);
  color:var(--dim);letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;font-weight:400}
p{margin:var(--sp2) 0}
.note{color:var(--dim);font-size:13px}
.tiny{color:var(--faint);font-size:12px}

/* ── 단계 레일 ─────────────────────────────────── */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative}
.steps li::before{content:"";position:absolute;left:10px;top:26px;bottom:-7px;
  width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--ok)}
.sIcon{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid var(--line);background:var(--surface);color:var(--faint);z-index:1}
.sIcon svg{width:12px;height:12px}
li.done .sIcon{border-color:var(--ok);background:var(--ok);color:var(--surface)}
li.now .sIcon{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
li.now .sIcon.spin svg{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sTxt{font-size:13.5px;line-height:1.35;padding-top:2px;color:var(--dim)}
li.done .sTxt{color:var(--ink)}
li.now .sTxt{color:var(--accent);font-weight:700}
.railHd{font-size:14px;font-weight:700;margin:0 0 var(--sp1);word-break:break-all}

/* ── 지금 할 일 배너 ────────────────────────────── */
.cta{border:1px solid var(--accent);background:var(--accent-bg);
  border-radius:var(--r-lg);padding:var(--sp4)}
.cta .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--accent);letter-spacing:.04em;margin-bottom:6px}
.cta .lab svg{width:13px;height:13px}
.cta h2{font-size:17px;margin-bottom:var(--sp1)}
.cta.wait{border-color:var(--line-strong);background:var(--surface-2)}
.cta.wait .lab{color:var(--dim)}
.cta.done{border-color:var(--ok);background:var(--ok-bg)}
.cta.done .lab{color:var(--ok)}
.cta.bad{border-color:var(--bad);background:var(--bad-bg)}
.cta.bad .lab{color:var(--bad)}

/* ── 진행 중 ──────────────────────────────────── */
.skel{height:11px;border-radius:6px;background:linear-gradient(90deg,
  var(--code) 25%,var(--surface-2) 37%,var(--code) 63%);
  background-size:400% 100%;animation:sh 1.5s ease-in-out infinite;margin:7px 0}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.elapsed{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* ── 입력 ─────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.field>label{font-size:12.5px;font-weight:600;color:var(--dim)}
input,textarea,select{width:100%;min-height:44px;padding:10px 12px;font:inherit;font-size:15px;
  border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);
  color:var(--ink);font-family:inherit}
input:hover,textarea:hover,select:hover{border-color:var(--accent)}
textarea{min-height:78px;resize:vertical;line-height:1.55}
button{font:inherit;font-size:14.5px;font-weight:600;min-height:44px;padding:10px 18px;
  border-radius:var(--r);cursor:pointer;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);transition:background .16s,border-color .16s,transform .1s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
button:active:not(:disabled){transform:scale(.985)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
button.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
button.small{min-height:36px;padding:6px 12px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:var(--sp2);flex-wrap:wrap;align-items:flex-end}
.row.mid{align-items:center}

/* ── 알림 상자 ─────────────────────────────────── */
.box{border-left:3px solid;padding:10px 13px;border-radius:0 var(--r) var(--r) 0;margin:var(--sp2) 0}
.box.ok{background:var(--ok-bg);border-color:var(--ok)}
.box.warn{background:var(--warn-bg);border-color:var(--warn)}
.box.bad{background:var(--bad-bg);border-color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;
  border-radius:20px;font-weight:700;vertical-align:middle}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.neutral{background:var(--code);color:var(--dim)}

/* ── 후보 ─────────────────────────────────────── */
.cands{display:grid;gap:var(--sp2)}
.cand{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;
  transition:border-color .16s,background .16s;background:var(--surface)}
.cand:hover{border-color:var(--accent)}
.cand.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.cand .ck{float:right;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);
  display:grid;place-items:center;color:transparent;flex:none;margin-left:8px}
.cand.on .ck{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.cand .ck svg{width:12px;height:12px}
.cand h4{margin:0 0 4px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--code);color:var(--dim);
  text-decoration:none}
a.chip:hover{background:var(--accent-bg);color:var(--accent)}

/* ── 검증 4칸 ─────────────────────────────────── */
.quad{display:grid;gap:var(--sp3);grid-template-columns:1fr}
@media(min-width:720px){.quad{grid-template-columns:1fr 1fr}}
.quad section{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--surface-2)}
.quad h3{margin:0 0 var(--sp2);display:flex;align-items:center;gap:6px}
.quad ul{margin:0;padding-left:18px;font-size:13.5px}
.quad li{margin:5px 0}

/* ── 표 ───────────────────────────────────────── */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
th{background:var(--surface-2);font-weight:700;font-size:12.5px;color:var(--dim);white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* ── 카드 갤러리 ───────────────────────────────── */
.gal{display:grid;gap:var(--sp4);grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.shot{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.shot img{width:100%;aspect-ratio:1080/1350;object-fit:cover;display:block;cursor:zoom-in;
  background:var(--code);transition:opacity .16s}
.shot img:hover{opacity:.9}
.shot figcaption{padding:10px 12px;font-size:12.5px;border-top:1px solid var(--line)}
.shot .edit{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.shot .edit input,.shot .edit textarea{min-height:38px;font-size:13.5px;padding:7px 10px}
.shot .edit textarea{min-height:62px}
dialog{border:none;border-radius:var(--r-lg);padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(20,19,23,.72)}
dialog img{max-width:min(92vw,760px);max-height:88vh;border-radius:var(--r-lg);display:block}
dialog .x{position:absolute;top:10px;right:10px;min-height:36px;padding:6px 12px}

/* ── 접기 ─────────────────────────────────────── */
details.fold{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--shadow)}
details.fold>summary{cursor:pointer;padding:13px var(--sp4);font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:var(--sp2);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;width:8px;height:8px;flex:none;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
  transform:rotate(45deg);transition:transform .18s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>summary:hover{background:var(--surface-2)}
details.fold .bd{padding:0 var(--sp4) var(--sp4)}
details.fold>summary .sub{margin-left:var(--sp1);font-weight:400}

pre{background:var(--code);padding:10px 12px;border-radius:var(--r);overflow-x:auto;
  font-family:var(--mono);font-size:12px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
a{color:var(--accent);text-underline-offset:2px}
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:15px;height:15px;flex:none}
.hide{display:none!important}
.rowlist{display:flex;flex-direction:column;gap:2px}
.rowlist a{display:flex;gap:var(--sp2);align-items:baseline;padding:7px 10px;border-radius:8px;
  text-decoration:none;color:var(--ink);border:1px solid transparent;flex-wrap:wrap}
.rowlist a:hover{background:var(--surface-2);border-color:var(--line)}
.rowlist .nm{font-weight:600;font-size:14px}
</style>
</head>
<body>

<header class="top">
  <span class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    카드뉴스 에이전트
  </span>
  <span class="tag">주제 하나 → 조사 → <b>내가 고르고</b> → 승인 → 카드</span>
  <span class="spacer"></span>
  <span class="live" id="live"></span>
</header>

<div class="shell" id="shell">
  <aside class="rail" id="rail"></aside>
  <div class="col" id="col"></div>
</div>

<dialog id="lb"><button class="x" onclick="document.getElementById('lb').close()">닫기</button><img id="lbImg" alt=""></dialog>

<script>
/* ════════════════════════════════════════════════════════════
   ★데이터 출처를 «갈아 끼울 수 있게» 했다

   로컬  : 실제 API (127.0.0.1) — 진짜로 돈다
   배포본: 저장된 실행을 «재생» — 키도 설치도 없이 링크만으로 전 과정을 본다
           (요건: 「다른 사람이 링크만으로 접속해 워크플로를 실행해 볼 수 있어야」)

   화면 코드는 «하나»다. 출처만 다르다.
   ════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo');                 // 'news' | 'myth' | null
let pid = Q.get('p'), poll = null, sel = new Set(), demoState = null, demoStep = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rid = () => 'r-' + Math.random().toString(36).slice(2, 12);

const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  dot:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>',
  spin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9"/></svg>'
};

async function jget(u) {
  if (DEMO) return demoGet(u);
  const r = await fetch(u); return r.json();
}
async function jpost(u, b) {
  if (DEMO) return { status: 200, data: { demo: true, message: '데모에서는 실행하지 않습니다' } };
  const r = await fetch(u, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(b || {}) });
  return { status: r.status, data: await r.json() };
}

const STAGES = [['research','조사'],['select','후보 선택'],['deep','심층 검증'],
  ['storyboard','기획 승인'],['produce','제작'],['review','검수'],['export','내려받기']];
const atStage = n => STAGES.findIndex(x => x[0] === n);

/* ── 데모 재생 ────────────────────────────────── */
async function demoGet(u) {
  if (u === '/api/health') return demoState.__health || { engine:{ok:true}, font:null, antigravity:false };
  if (u === '/api/projects') return { projects: [] };
  return maskToStep(demoState);
}
/** ★재생 = 저장된 «최종 상태»를 단계별로 «가려» 보여 준다.
 *  없는 것을 지어내지 않는다 — 있는 것을 순서대로 드러낼 뿐이다. */
function maskToStep(s) {
  if (demoStep === null) return s;
  const i = demoStep;
  const o = Object.assign({}, s, { stage: STAGES[i][0],
    status: i >= atStage('export') ? 'done' : 'ready', question: null });
  if (i < atStage('select')) o.candidates = [];
  if (i < atStage('deep')) { o.research = null; o.editorial = null; }
  if (i < atStage('storyboard')) o.storyboard = null;
  if (i < atStage('produce')) o.cards = [];
  if (i < atStage('export')) o.exports = null;
  return o;
}

/* ── 부팅 ─────────────────────────────────────── */
async function boot() {
  if (DEMO) {
    const r = await fetch('runs/' + DEMO + '.json');
    if (!r.ok) { $('#col').innerHTML = panel('데모를 불러오지 못했습니다',
      '<p class="note">runs/' + esc(DEMO) + '.json 을 찾을 수 없습니다.</p>'); return; }
    demoState = await r.json(); pid = demoState.projectId;
    demoStep = STAGES.length - 1;
    return render();
  }
  if (pid) return watch();
  renderHome();
}

function panel(title, body, sub) {
  return '<div class="panel"><div class="hd"><h2>' + title + '</h2>' +
    (sub ? '<span class="sub">' + sub + '</span>' : '') +
    '</div><div class="bd">' + body + '</div></div>';
}
function fold(title, body, sub, open) {
  return '<details class="fold"' + (open ? ' open' : '') + '><summary>' + title +
    (sub ? '<span class="sub">' + sub + '</span>' : '') +

async function start() {

function watch() { if (poll) clearInterval(poll); render(); poll = setInterval(render, 2500); }

/* ── 지금 할 일 ───────────────────────────────── */
function nextAction(s, busy) {
  if (s.status === 'error') return { kind:'bad', lab:'막혔습니다', t:'오류를 확인하고 다시 시도하세요',
    d:'아래 「무엇이 막혔나」에 원인과 <b>다음에 할 수 있는 것</b>이 있습니다.' };
  if (s.question) return { kind:'act', lab:'사람 차례', t:'에이전트가 묻고 있습니다',
    d:'답하기 전에는 다음 단계로 넘어가지 않습니다.' };
  if (busy) return { kind:'wait', lab:'에이전트 차례', t:'작업 중입니다', d:null };
  if (s.stage === 'select' && s.candidates && s.candidates.length) return { kind:'act', lab:'사람 차례',
    t:'후보 ' + s.candidates.length + '개 중 1~3개를 고르세요', d:'고른 것만 심층 검증합니다.' };
  if (s.stage === 'storyboard' && s.editorial && !s.storyboard) return { kind:'act', lab:'사람 차례',
    t:'스토리보드를 만들 차례입니다', d:'검증 결과와 편집 판단을 바탕으로 카드 구성을 짭니다.' };
  if (s.storyboard && !s.storyboard.approved) return { kind:'act', lab:'사람 차례',
    t:'기획을 승인하면 제작을 시작합니다', d:'★승인 전에는 이미지 제작을 시작하지 않습니다.' };
  if (s.exports) return { kind:'done', lab:'완료', t:'카드가 준비됐습니다',
    d:'ZIP 과 출처 기록을 내려받을 수 있습니다.' };
  if (s.cards && s.cards.length) return { kind:'act', lab:'사람 차례', t:'카드를 검수하세요',
    d:'고칠 카드만 따로 수정할 수 있습니다. 수정하면 최종 승인이 «해제»됩니다.' };
  return null;
}

/* ── 본 화면 ──────────────────────────────────── */
async function render() {
  const s = await jget('/api/projects/' + pid);
  if (!s || s.error) return;
  const busy = !DEMO && (s.running || s.status === 'researching');
  const cur = atStage(s.stage);

  $('#shell').classList.add('has-rail');
  $('#live').innerHTML = DEMO
    ? '<span class="dot on"></span>데모 재생'
    : '<span class="dot ' + (busy ? 'busy' : 'on') + '"></span>' + (busy ? '작업 중' : esc(s.status));

  /* 레일 */
  $('#rail').innerHTML = '<div class="panel"><div class="bd">' +
    '<p class="railHd">' + esc(s.topic) + '</p>' +
    '<p class="tiny" style="margin:0 0 12px">' + esc(s.projectId) + '</p>' +
    '<ul class="steps">' + STAGES.map(function (st, j) {
      const cls = j < cur ? 'done' : j === cur ? 'now' : '';
      const ic = j < cur ? I.check : (j === cur && busy) ? I.spin : I.dot;
      return '<li class="' + cls + '"><span class="sIcon ' + (j === cur && busy ? 'spin' : '') + '">' +
        ic + '</span><span class="sTxt">' + st[1] + '</span></li>'; }).join('') + '</ul>' +
    (s.searchedAt ? '<p class="tiny" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">조사 기준 ' +
      esc(s.searchedAt) + (s.periodDays ? ' · 최근 ' + s.periodDays + '일' : '') + '</p>' : '') +
    (DEMO ? demoControls() : '<p class="tiny" style="margin-top:10px"><a href="./">← 새 작업</a></p>') +
  '</div></div>';

  let h = '';

  /* ① 지금 할 일 */
  const act = nextAction(s, busy);
  if (act) {
    const cls = act.kind === 'wait' ? 'cta wait' : act.kind === 'done' ? 'cta done'
      : act.kind === 'bad' ? 'cta bad' : 'cta';
    const ic = act.kind === 'wait' ? I.clock : act.kind === 'done' ? I.check
      : act.kind === 'bad' ? I.alert : I.hand;
    h += '<div class="' + cls + '"><span class="lab">' + ic + ' ' + act.lab + '</span>' +
      '<h2>' + esc(act.t) + '</h2>' + (act.d ? '<p class="note">' + act.d + '</p>' : '') +

  /* ② 오류 — 숨기지 않는다 */
  (s.errors || []).slice(-3).forEach(function (e) {
    h += '<div class="panel"><div class="hd"><h2>무엇이 막혔나</h2><span class="sub">' +

  /* ③ 질문 */
  if (s.question) {

    h += panel('에이전트의 질문',

  /* ⑩ 실행 기록 */
  if (s.runs && s.runs.length) {
    h += fold('실행 기록', '<div class="tw"><table><thead><tr><th>때</th><th>주체</th><th>단계</th><th>내용</th></tr></thead><tbody>' +
      s.runs.slice(-14).reverse().map(function (r) {
        return '<tr><td class="tiny">' + new Date(r.at * 1000).toLocaleTimeString('ko') + '</td>' +
        '<td>' + (r.kind === 'human' ? '<b>사람</b>' : esc(r.kind)) + '</td>' +
        '<td>' + esc(r.step || '') + '</td>' +
        '<td class="note">' + esc(r.note || '') +
          (r.ms ? ' · ' + (r.ms / 1000).toFixed(1) + 's' : '') +
          (r.webSearches ? ' · 검색 ' + r.webSearches + '회' : '') +
          (r.costUsd ? ' · $' + r.costUsd.toFixed(3) : '') +
          (r.reason ? ' · <b>' + esc(r.reason) + '</b>' : '') +
          (r.backgroundUnchanged !== undefined ? ' · 배경 ' + (r.backgroundUnchanged ? '유지됨' : '★바뀜') : '') +
        '</td></tr>'; }).join('') + '</tbody></table></div>',
      '최근 ' + Math.min(14, s.runs.length) + '건 / 전체 ' + s.runs.length);
  }

  $('#col').innerHTML = h;

  /* ★모델이 만든 문자열을 코드에 끼워 넣지 않는다 — 값으로 넘긴다 */
  if (s.question) {
    const q = s.question;
    document.querySelectorAll('#qopts button').forEach(function (b) {
      b.onclick = function () { answer(q.id, q.version, q.options[+b.dataset.ans]); }; });
    const fs = $('#freeSend');
    if (fs) fs.onclick = function () { answer(q.id, q.version, $('#freeAns').value); };
  }
  if (!DEMO && (s.stage === 'export' || s.status === 'error')) {
    if (poll) { clearInterval(poll); poll = null; }
  }
}

function cardSrc(c) {
  const n = String(c.n).padStart(2, '0');
  return DEMO ? 'runs/' + DEMO + '-cards/card-' + n + '.jpg'
              : '/files/' + pid + '/cards/card-' + n + '.png?t=' + Date.now();
}
function quad(t, arr, cls) {
  const n = (arr && arr.length) || 0;
  return '<section><h3>' + t + ' <span class="badge ' + (n ? cls : 'neutral') + '">' + n + '</span></h3>' +
    (n ? '<ul>' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
       : '<p class="tiny" style="margin:0">없음</p>') + '</section>';
}
function busyBody(s) {
  const last = (s.runs || []).slice(-1)[0];
  const sec = last ? Math.max(0, Math.round(Date.now() / 1000 - last.at)) : 0;
  const mm = String(Math.floor(sec / 60)).padStart(2, '0'), ss = String(sec % 60).padStart(2, '0');
  return '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +
    '<div class="row mid" style="justify-content:space-between">' +
    '<span class="note">' + esc((last && (last.note || last.step)) || '진행 중') + '</span>' +
    '<span class="elapsed">' + mm + ':' + ss + '</span></div>' +
    '<div class="skel" style="width:100%"></div><div class="skel" style="width:76%"></div>' +
    '<p class="tiny" style="margin:6px 0 0">웹 검색과 모델 호출은 <b>2~4분</b>까지 걸립니다. 창을 닫아도 작업은 계속되고, 다시 열면 이어집니다.</p></div>';
}
function demoControls() {
  return '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">' +
    '<p class="tiny" style="margin:0 0 6px"><b>데모 재생</b> — 저장된 실제 실행입니다</p>' +
    '<div class="row" style="gap:6px">' +
      '<button class="small" onclick="stepDemo(-1)" ' + (demoStep <= 0 ? 'disabled' : '') + '>◀ 이전</button>' +
      '<button class="small" onclick="stepDemo(1)" ' + (demoStep >= STAGES.length - 1 ? 'disabled' : '') + '>다음 ▶</button></div>' +
    '<p class="tiny" style="margin:6px 0 0">' + (demoStep + 1) + ' / ' + STAGES.length + ' 단계</p>' +
    '<p class="tiny" style="margin:8px 0 0"><a href="?demo=' + (DEMO === 'myth' ? 'news' : 'myth') + '">' +
      (DEMO === 'myth' ? '「AI 최신소식」 실행 보기' : '「신화 이야기」 실행 보기') + ' →</a></p></div>';
}
function stepDemo(d) {
  demoStep = Math.min(STAGES.length - 1, Math.max(0, demoStep + d));
  render();
}
function zoom(src) { $('#lbImg').src = src; $('#lb').showModal(); }

/* ── 동작 (원본과 동일) ────────────────────────── */
function pick(id) {
  sel.has(id) ? sel.delete(id) : (sel.size < 3 && sel.add(id));
  render();
}
async function submitSel(v) {
  if (!sel.size) return alert('1~3개를 고르세요');
  const r = await jpost('/api/projects/' + pid + '/selection', { candidateIds: Array.from(sel), version: v });
  if (r.status !== 200) return alert(r.data.message || r.data.error);
  await jpost('/api/projects/' + pid + '/deep', { requestId: rid() }); render();
}
async function answer(qid, v, a) {
  if (!a) return;
  const r = await jpost('/api/projects/' + pid + '/answers',
    { questionId: qid, version: v, answer: a, requestId: rid() });
  if (r.status !== 200) alert(r.data.message || r.data.error);
  render();
}
async function story() { await jpost('/api/projects/' + pid + '/storyboard', { cards: 5, requestId: rid() }); render(); }
async function approve(stage, v) {
  const r = await jpost('/api/projects/' + pid + '/approve', { stage: stage, version: v, requestId: rid() });
  if (r.status !== 200) alert(r.data.message || r.data.error);
  if (!poll) watch(); render();
}
async function widen() { await jpost('/api/projects/' + pid + '/research', { widen: true, requestId: rid() }); render(); }
async function revise(n) {
  const r = await jpost('/api/projects/' + pid + '/revisions',
    { cardNo: n, title: $('#t' + n).value, body: $('#b' + n).value, requestId: rid() });
  const el = $('#revNote');
  if (el) el.innerHTML = r.data.ok
    ? '<div class="box ok">카드 ' + n + ' 수정됨 — 배경 ' + (r.data.backgroundUnchanged ? '<b>그대로</b>(다시 받지 않음)' : '★바뀜') +
      ' · 나머지 카드 ' + (r.data.otherCardsUnchanged ? '<b>유지됨</b>' : '★바뀜') + '</div>'
    : '<div class="box bad">수정 실패: ' + esc((r.data.render && r.data.render.reason) || r.data.reason) + '</div>';
  render();
}
boot();
</script>
</body>
</html>
