# 「발견」 뉴스레터 — 이번 주에 «새로 알게 된» 것들
#
# 주영님 말에서 나온 축:
#   「우주랑 고고학 이런 것들이 뭔가 «새롭게 발견한 것들»이잖아」
# ⇒ 우주에서 «찾은 것» · 땅에서 «파낸 것» · 화석에서 «읽은 것» 을 한 줄로 묶는다.
#
# ★13강: 구조(사다리·관문·예선본선·코드강제·그래프·깔때기)는 «하나도 안 바꿨다».
#   바뀐 건 이 파일과 settings_discovery.yaml 둘뿐이다.

독자:
  누구: "과학 뉴스를 좋아하지만 논문은 안 읽는 사람 — 새로 밝혀진 것을 «무엇이 어떻게 달라졌나»로 알고 싶어한다"
  이미_아는_것: "고등학교 수준 과학. 전문 용어는 풀어 줘야 한다"

# 본선 프롬프트에 그대로 들어간다. 위에 있을수록 우선.
# ★기사 하나를 보고 «예/아니오»로 답할 수 있는 질문이어야 한다.
#   "흥미로운가"처럼 판정할 수 없는 문장을 적으면 모델이 매번 다르게 해석한다.
중요도_기준:
  - "«전에는 몰랐던 것»이 새로 밝혀졌나 — 발견·관측·발굴·해독 중 하나가 실제로 있었나"
  - "교과서에 적힌 내용을 «바꿀» 만한가 (연대가 당겨졌다·종이 새로 확인됐다·정설이 뒤집혔다)"
  - "무엇을 어떻게 알아냈는지 «방법»이 적혀 있나 (망원경·연대측정·DNA·라이다 등)"
  - "숫자가 있나 — 몇 년 전·몇 광년·몇 개체·몇 퍼센트"

# ★추상어 말고 «구체적인 장면»으로.
#   "홍보성 기사를 버려라"는 모델마다 다르게 해석하지만
#   "예산 확보·기관 개소·전시 개막"은 거의 틀리지 않는다.
버릴_것:
  - "발사 예정·착륙 예정·발굴 예정처럼 «아직 일어나지 않은» 일정만 있는 것"
  - "예산 확보·기관 개소·협약 체결·수상·인사 발령"
  - "전시 개막·행사 안내·관람 후기 (연구 내용이 아니라 «행사»가 주제인 것)"
  - "우주기업 주가·투자 유치·계약 수주 등 «산업 면» 기사"
  - "제목이 「~일까?」·「놀라운」·「충격」으로 끝나고 본문에 새 사실이 없는 것"
  - "이미 몇 해 전에 알려진 내용을 다시 소개하는 해설 기사"

토픽:
  - 이름: "우주·천문"
    데스크지침: "무엇으로 관측했는지(망원경·탐사선 이름)와 «거리·나이·크기»를 숫자로 반드시"
  - 이름: "고고학·유적"
    데스크지침: "어디서·몇 년 전 것인지 «연대»를 반드시. 연대측정 방법도 한 줄"
  - 이름: "고생물·화석"
    데스크지침: "종 이름과 «몇 만/억 년 전»을 반드시. 기존에 알려진 것과 무엇이 다른지"
  - 이름: "옛 인류"
    데스크지침: "어떤 인류종인지, 기존 연대·분포와 무엇이 달라졌는지"
  - 이름: "지구·자연"
    데스크지침: "어디서 일어난 일인지 지명을 반드시. 관측 기간도"
