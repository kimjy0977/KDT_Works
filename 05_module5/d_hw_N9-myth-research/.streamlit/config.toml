# ★테마 — 「성좌 필사본」
#   장식이 아니라 «내용»에서 끌어냈다.
#     밤하늘  신화가 새겨진 곳          → 심야 남색 (⛔순흑 금지 · OLED smear)
#     금박    인용·근거                 → 근거가 붙으면 금이 박힌다
#     양피지  본문                      → 배경 대비 13.2:1
#
#   ⚠config.toml 은 «기본»만 잡는다. 나머지는 app.py 가 CSS 로 건다 —
#     Streamlit 테마는 폰트·간격·컴포넌트 모양을 못 바꾼다.
[theme]
base = "dark"
primaryColor = "#C9A227"              # brass — 인용·근거·주 액션
backgroundColor = "#0F1520"           # 심야 남색
secondaryBackgroundColor = "#161E2B"  # 표면 1단
textColor = "#E8E4DA"                 # 양피지
font = "serif"

[server]
headless = true

[browser]
gatherUsageStats = false
