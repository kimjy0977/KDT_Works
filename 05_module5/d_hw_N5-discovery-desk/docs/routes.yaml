# 발견 데스크 — 라우트 정의 (초안 2026-09-17)
#
# ★노드4 에서 배운 것을 여기에 박아 둔다:
#   · 판단 기준은 «예/아니오로 답할 수 있는» 문장으로 쓴다
#     (「흥미로운가」 같은 건 모델이 매번 다르게 해석한다 — 노드3 audience.yaml)
#   · 경계 문항을 «의도적으로» 넣는다. 규칙 라우터가 틀리는 자리가 진짜 경계다
#   · OTHER 를 덜 쓰게 만들면 eval 은 오르고 범위 밖은 무너진다 — 둘을 같이 잰다

routes:
  - id: SPACE
    이름: 우주·천문
    판단: "지구 «밖»의 대상이 나오는가 — 행성·별·은하·탐사선·망원경·운석"
    도구: [search_article, get_fact_card, get_source]
    경계_문장:
      # ★어휘만 보면 다른 라우트로 샌다. 노드4 에서 SHIPPING 이 ORDER_PLACE 로 샌 것과 같은 자리
      - "운석에서 아미노산이 나왔다는데 생명의 기원인가요"     # 생명 → PALEO 로 샐 수 있다
      - "달에서 가져온 시료의 연대는 어떻게 쟀나요"           # 연대 → CONCEPT 로 샐 수 있다
      - "화성에 옛날 강이 흘렀다는 증거가 있나요"             # 옛날 → ARCHAEO 로 샐 수 있다

  - id: ARCHAEO
    이름: 고고학
    판단: "«사람이 만든 것»을 땅·물속에서 찾는 이야기인가 — 유적·유물·문자·무덤·난파선"
    도구: [search_article, get_fact_card, get_dating, get_source]
    경계_문장:
      - "고대 무덤에서 나온 뼈로 뭘 알 수 있나요"            # 뼈 → PALEO 로 샐 수 있다
      - "점토판 문자는 어떻게 해독했나요"                    # 어떻게 → CONCEPT 로 샐 수 있다
      - "피라미드 건설에 쓰인 돌은 어디서 왔나요"

  - id: PALEO
    이름: 고생물
    판단: "«살아 있던 것»의 흔적인가 — 화석·뼈·발자국·멸종·진화·고DNA"
    도구: [search_article, get_fact_card, get_dating, get_source]
    경계_문장:
      - "공룡 멸종에 소행성이 얼마나 관여했나요"             # 소행성 → SPACE 로 샐 수 있다
      - "네안데르탈인 유적에서 도구가 나왔다던데"            # 유적·도구 → ARCHAEO 로 샐 수 있다
      - "화석의 색은 어떻게 알아내나요"                      # 어떻게 → CONCEPT

  - id: CONCEPT
    이름: 용어·방법·원리
    판단: "★«대상이 없이» 방법이나 말만 묻는가 — 화석·유적·행성 같은 대상이 나오면 그 라우트다"
    도구: [get_term, get_source]
    경계_문장:
      # ★이 라우트가 가장 어렵다 — 다른 셋과 «전부» 겹친다
      - "방사성 탄소 연대측정이 뭔가요"
      - "적색편이는 왜 생기나요"
      - "층서학에서 지층 순서를 어떻게 정하나요"

  - id: OTHER
    이름: 범위 밖
    판단: "위 넷에 «대상»이 없거나, 과학적 방법으로 답할 수 없는가"
    도구: []
    포함:
      - 유사과학       # 점성술 · 타로 · 지구평면설 · 고대외계인설 · 연금술
      - 의학_상담      # 「이 성분이 몸에 좋나요」
      - 미래_예측      # 확률 발표가 «있을 때만» 그 값을 인용하고, 없으면 OTHER
      - 개인_조언      # 투자 · 진로 · 신상
      - 잡담

# ★확실성 등급 — policy 와 «같은 말»을 쓴다
#   서로 다른 말을 쓰면 모델이 둘을 다른 것으로 본다 (노드4 에서 must 가 문자열 검사였던 것과 같은 함정)
확실성_등급:
  - id: 정설
    뜻: "널리 합의됐다. 교과서에 있다"
    답변_규칙: "그대로 말해도 된다. 다만 «약»·«경»을 빼지 않는다"
  - id: 추정
    뜻: "오차 범위가 있다"
    답변_규칙: "숫자에 «약»을 붙이고, 오차가 알려져 있으면 함께 말한다"
  - id: 논쟁
    뜻: "학계가 갈린다"
    답변_규칙: "양쪽을 말하고 «고르지 않는다». 무엇이 정해지면 갈릴지를 말한다"
  - id: 신설
    뜻: "최근 발표 — 아직 재현·검증되지 않았다"
    답변_규칙: |
      ★필수 3요소: ① 발표 시점 ② 발표 주체 ③ 「아직 검증되지 않았다」
      ⛔ 「밝혀졌습니다」 금지 → 「발표됐습니다」
         그 한 단어가 [신설] 을 [정설] 로 바꾼다

# 가드레일 — 노드4 것에 «②·③» 을 더한다
가드레일:
  - id: 출처없는_수치
    막는_것: "자료·매뉴얼에 없는 숫자"
    근거: 노드4 그대로
  - id: 확실성_단정          # ★이 프로젝트의 핵심
    막는_것: "[신설]·[논쟁] 을 [정설]처럼 말하는 것"
    신호: ["밝혀졌", "입증됐", "확인됐", "결론이 났", "정설입니다"]
    ⚠: "★오탐을 «모범 답안»으로 먼저 재고, ★재현율도 같이 잰다 (노드4 에서 빠뜨린 축)"
  - id: 답하면_안되는_것
    막는_것: "의학 조언 · 미래 단정 · 유사과학 판정"
    근거: policy 원칙 5
